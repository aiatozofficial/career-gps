<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Career GPS">
  <!-- Background rounded square teal gradient -->
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28b7a5"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Compass outer ring -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="white" stroke-opacity="0.95" stroke-width="1.8"/>
  <circle cx="16" cy="16" r="1.9" fill="white"/>
  <!-- Compass needle - teal/dark split -->
  <path d="M16 8.5 L17.9 15.2 L16 16 L14.1 15.2 Z" fill="white"/>
  <path d="M16 23.5 L14.1 16.8 L16 16 L17.9 16.8 Z" fill="#0f172a" fill-opacity="0.95"/>
  <!-- Cardinal ticks -->
  <rect x="15.4" y="6.8" width="1.2" height="2.2" rx="0.6" fill="white" opacity="0.95"/>
  <rect x="15.4" y="23" width="1.2" height="2.2" rx="0.6" fill="white" opacity="0.75"/>
  <rect x="6.8" y="15.4" width="2.2" height="1.2" rx="0.6" fill="white" opacity="0.75"/>
  <rect x="23" y="15.4" width="2.2" height="1.2" rx="0.6" fill="white" opacity="0.75"/>
  <!-- Small N marker -->
  <circle cx="16" cy="7.2" r="0" />
</svg>
